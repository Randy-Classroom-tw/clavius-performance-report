function lineChart(k){const info=metricInfo[k],W=390,H=280,L=46,R=16,T=18,B=38,x=i=>L+i*(W-L-R)/8,y=v=>T+(1-v/info.scale/info.max)*(H-T-B),a=monthlyPairs.map(r=>monthValue(r.a,k)),b=monthlyPairs.map(r=>monthValue(r.b,k));let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="逐月${info.title}，2025 淡色與2026 梅紫折線"><title>逐月${info.title}兩年比較</title>`;info.ticks.forEach(v=>s+=`<line x1="${L}" y1="${y(v*info.scale)}" x2="${W-R}" y2="${y(v*info.scale)}" stroke="#e1dce0" stroke-width="1"/><text x="${L-8}" y="${y(v*info.scale)+5}" text-anchor="end">${num(v)}</text>`);if(k!=='spend')s+=`<polygon points="${a.map((v,i)=>x(i)+','+y(v)).join(' ')} ${b.map((v,i)=>[x(i),y(v)]).reverse().map(v=>v.join(',')).join(' ')}" fill="#654b5d" fill-opacity=".055"/>`;[a,b].forEach((v,j)=>{s+=`<polyline points="${v.map((z,i)=>x(i)+','+y(z)).join(' ')}" fill="none" stroke="${j?newColor:oldColor}" stroke-width="2.5" stroke-linejoin="round"/>`;v.forEach((z,i)=>s+=`<circle cx="${x(i)}" cy="${y(z)}" r="3.1" fill="${j?newColor:oldColor}"><title>${monthLabel(i+1)}・${j?'2026':'2025'}：${num(z)}${k==='people'?'人':'元'}</title></circle>`)});monthlyPairs.forEach((r,i)=>s+=`<text class="month-axis" x="${x(i)}" y="${H-13}" text-anchor="middle">${monthLabel(r.month)}</text>`);return s+'</svg>'}
function overviewRevenueChart(){const host=byId('overview-revenue-chart'),W=Math.max(320,Math.floor(host.clientWidth||900)),H=W<560?260:300,L=W<560?42:50,R=17,T=18,B=H-38,max=200,step=50,x=i=>L+i*(W-L-R)/8,y=v=>B-v/max*(B-T),a=monthlyPairs.map(r=>r.a.revenue/10000),b=monthlyPairs.map(r=>r.b.revenue/10000);let svg=`<svg class="overview-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="2025 與 2026 年01月至09月營業額折線圖"><title>逐月營收對照，單位萬元</title>`;for(let v=0;v<=max;v+=step)svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="curve-grid"/><text x="${L-9}" y="${y(v)+4}" text-anchor="end">${num(v)}</text>`;svg+=`<polygon points="${a.map((v,i)=>`${x(i)},${y(v)}`).join(' ')} ${b.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ')}" fill="var(--main)" fill-opacity=".065"/>`;for(const [values,yr,c] of [[a,2025,'past'],[b,2026,'main']]){svg+=`<polyline points="${values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--${c})" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;values.forEach((v,i)=>svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--${c})"><title>${yr} ${monthLabel(i+1)}：${num(monthlyPairs[i][yr===2025?'a':'b'].revenue)} 元</title></circle>`)}monthlyPairs.forEach((r,i)=>svg+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${monthLabel(r.month)}</text>`);host.innerHTML=svg+'</svg>'}
overviewRevenueChart();let curveFrame;const curveObserver=new ResizeObserver(()=>{cancelAnimationFrame(curveFrame);curveFrame=requestAnimationFrame(()=>{if(!byId('panel-overview').hidden)overviewRevenueChart()})});curveObserver.observe(byId('overview-revenue-chart'));window.addEventListener('beforeprint',overviewRevenueChart);window.addEventListener('afterprint',overviewRevenueChart);

byId('panel-monthly').innerHTML=`${head('monthly','三個指標，逐月並排比較。')}<div class="chart-grid">${['revenue','people','spend'].map(k=>`<article class="chart-card"><h3>${metricInfo[k].title}</h3><span class="unit">${metricInfo[k].unit}</span>${lineChart(k)}<div class="chart-change"><span>01~09月變化</span>${change(T25[k],T26[k])}</div></article>`).join('')}</div><div class="card"><div class="card-head"><h3>${icon('monthly')}逐月數字</h3><span class="unit">金額／元・來客／人</span></div>${table(['月份','2025 營收','2026 營收','變化','2025 來客','2026 來客','變化','2025 客單','2026 客單','變化'],monthlyRows,'monthly-table','逐月營收、來客與客單比較')}</div>`;

byId('panel-weekday').innerHTML=`${head('weekday','星期與午晚餐，同樣少了客人。')}<div class="split"><div class="card weekday-card"><div class="card-head"><h3>${icon('weekday')}星期平均來客</h3><span class="unit">人／營業日</span></div>${weekdayColumns()}${table(['星期','2025 人／天','2026 人／天','變化','2025 天數','2026 天數'],weekdayPairs.map(r=>[r.name,num(r.a,1),num(r.b,1),change(r.a,r.b),num(r.da),num(r.db)]),'detail-table','各星期平均來客與營業天數')}</div><div class="card"><div class="card-head"><h3>${icon('mix')}午餐與晚餐</h3><span class="unit">來客／人</span></div>${mealPairs.map(r=>`<article class="meal-block"><div class="row-title"><h3>${r.name}</h3>${change(r.a,r.b)}</div><div class="meal-values"><div><div class="year-label">2025</div><div class="big old">${num(r.a)}</div></div><div><div class="year-label">2026</div><div class="big new">${num(r.b)}</div></div></div></article>`).join('')}</div></div><div class="card"><div class="card-head"><h3>${icon('revenue')}餐別營收與人數</h3></div>${table(['餐別','2025 營收／元','2026 營收／元','營收變化','2025 人數','2026 人數','人數變化'],['午餐','晚餐'].map(m=>{const a=DATA.meal.find(r=>r.year===2025&&r.meal===m),b=DATA.meal.find(r=>r.year===2026&&r.meal===m);return [m,num(a.revenue),num(b.revenue),change(a.revenue,b.revenue),num(a.people),num(b.people),change(a.people,b.people)]}),'wide-table','午晚餐營收與來客對照')}</div>`;
const mostLoss=[...categoryPairs].filter(r=>r.name!=='套餐').sort((a,b)=>(b.a-b.b)-(a.a-a.b))[0];
let categorySort='amount';
function categoryTable(){const rows=[...categoryPairs].sort((a,b)=>categorySort==='amount'?b.b-a.b:diff(a.a,a.b)-diff(b.a,b.b));return table(['品項','2025 銷售／元','2026 銷售／元','銷售變化','2025 佔比','2026 佔比','佔比增減'],rows.map(r=>[esc(r.name),num(r.a),num(r.b),change(r.a,r.b),num(r.sa,1)+'%',num(r.sb,1)+'%',pp(r.sa,r.sb)]),'wide-table','全部十七類品項比較')}
byId('panel-category').innerHTML=`${head('category','套餐佔比提高，銷售額仍下降。')}<div class="summary-grid">${summary('今年套餐佔比',num(set.sb,1)+'%',`2025：${num(set.sa,1)}%`,'new')}${summary('套餐銷售額變化',pct(diff(set.a,set.b)),`${num(set.a)} → ${num(set.b)} 元`,'down')}${summary('套餐外銷售缺口最大',num(mostLoss.a-mostLoss.b),esc(mostLoss.name)+'／元','down')}</div><div class="card"><div class="card-head"><h3>${icon('category')}全部 ${num(categoryPairs.length)} 類品項</h3><label class="category-control">排序<select id="category-sort"><option value="amount">今年金額，由高到低</option><option value="decline">變化率，由低到高</option></select></label></div><div id="category-table">${categoryTable()}</div></div>`;
function barRows(rows){const max=Math.max(...rows.flatMap(r=>[r.a,r.b]));return rows.map(r=>`<div class="bar-row"><div class="bar-label">${esc(r.name)}</div><div class="year-bars">${[[r.a,2025],[r.b,2026]].map(([v,y])=>{const w=v/max*100;return `<div class="bar-line"><span class="bar-year">${y}</span><div class="bar-space" style="--w:${w}%"><div class="bar-fill ${y===2026?'current':''}" style="width:${w}%"></div><span class="bar-number ${y===2026?'current':''}">${num(v)}</span></div></div>`}).join('')}</div><div class="bar-delta">${change(r.a,r.b)}</div></div>`).join('')}
const missingPeopleA=total('people').y2025-DATA.inl_source.reduce((s,r)=>s+r.p25,0),missingPeopleB=total('people').y2026-DATA.inl_source.reduce((s,r)=>s+r.p26,0);
byId('panel-source').innerHTML=`${head('source','Google 與店家代訂，人流減少最明顯。')}<div class="summary-grid">${summary('Google 已入座組數',pct(diff(google.a,google.b)),`${num(google.a)} → ${num(google.b)} 組`,'down')}${summary('店家代訂已入座組數',pct(diff(proxy.a,proxy.b)),`${num(proxy.a)} → ${num(proxy.b)} 組`,'down')}${summary('inline 官網降幅最小',pct(diff(official.a,official.b)),`${num(official.a)} → ${num(official.b)} 組`,'down')}</div><div class="card"><div class="card-head"><h3>${icon('source')}已入座訂位來源</h3><span class="unit">組</span></div>${barRows(sourcePairs)}</div><div class="card"><div class="card-head"><h3>${icon('mix')}來源組數與人數</h3></div>${table(['來源','2025 組','2026 組','組數變化','2025 人','2026 人','人數變化'],sourcePairs.map(r=>{const pa=r===missingSource?missingPeopleA:r.pa,pb=r===missingSource?missingPeopleB:r.pb;return [esc(r.name),num(r.a),num(r.b),change(r.a,r.b),num(pa),num(pb),change(pa,pb)]}),'wide-table','訂位來源組數與人數')}</div>`;

byId('panel-mix').innerHTML=`${head('mix','訂位人流減少，現場登記增加。')}<div class="mix-grid">${mixPairs.map(r=>`<article class="mix-card"><h3>${icon('mix')}${r.name}</h3><div class="mix-pair">${[[r.a,2025,T25],[r.b,2026,T26]].map(([v,y,t])=>`<div class="mix-year ${y===2025?'old':'new'}"><div><p class="year">${y}／人</p><div class="big">${num(v)}</div></div><p class="share">${num(ratio(v,t.people),1)}%</p></div>`).join('')}</div><div class="change">${change(r.a,r.b)}</div></article>`).join('')}</div><div class="card"><div class="card-head"><h3>${icon('mix')}人流組成比較</h3></div>${table(['項目','2025 人數','2026 人數','人數變化','2025 佔比','2026 佔比'],mixPairs.map(r=>[r.name,num(r.a),num(r.b),change(r.a,r.b),num(ratio(r.a,T25.people),1)+'%',num(ratio(r.b,T26.people),1)+'%']),'detail-table','人流來源人數與佔比')}</div><div class="summary-grid">${pairedSummary('全部來客',T25.people,T26.people,'',0,' 人')}${pairedSummary('inline 登記現場客組數',DATA.inl_mix[0].walkin_groups,DATA.inl_mix[1].walkin_groups,'',0,' 組')}${summary('inline 訂位少了多少人',num(mixPairs[0].a-mixPairs[0].b),'已入座訂位人數減少','down')}</div>`;
const allStatuses=[...statusPairs,missingStatus],guest=statusPairs.find(r=>r.name==='客人取消'),rest=statusPairs.find(r=>r.name==='餐廳取消'),noShow=statusPairs.find(r=>r.name==='未到場'),lead=total('lead_days');

function showTab(id,{focus=false,hash=true}={}){const all=[...document.querySelectorAll('[data-tab]')],target=all.find(b=>b.dataset.tab===id);if(!target)return;all.forEach(b=>{const selected=b===target;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;byId('panel-'+b.dataset.tab).hidden=!selected});if(hash)history.replaceState(null,'','#'+id);if(focus)target.focus()}
document.querySelectorAll('[data-tab]').forEach(b=>{b.addEventListener('click',()=>showTab(b.dataset.tab));b.addEventListener('keydown',e=>{const all=[...document.querySelectorAll('[data-tab]')],i=all.indexOf(b);let next;if(['ArrowRight','ArrowDown'].includes(e.key))next=(i+1)%all.length;if(['ArrowLeft','ArrowUp'].includes(e.key))next=(i-1+all.length)%all.length;if(e.key==='Home')next=0;if(e.key==='End')next=all.length-1;if(next!==undefined){e.preventDefault();showTab(all[next].dataset.tab,{focus:true})}})});
byId('category-sort').addEventListener('change',e=>{categorySort=e.target.value;byId('category-table').innerHTML=categoryTable()});
byId('print-report').addEventListener('click',()=>window.print());window.addEventListener('hashchange',()=>showTab(location.hash.slice(1),{hash:false}));showTab(location.hash.slice(1)||'overview',{hash:false});
